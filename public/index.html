<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101010">
    <meta name="description" content="Selected digital work by Jonathon Westbrook.">
    <title>Jonathon Westbrook — Selected Work</title>
    <style>
      :root {
        color-scheme: dark;
        --paper: #101010;
        --ink: #f5f5f5;
        --muted: #b0b0b0;
        --line: #353535;
        --cyan: #00e5ff;
        --pink: #ff2d8d;
        --green: #b7ff00;
        --page-width: calc(100% - 80px);
        --page-max-width: 1760px;
        --sans: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif;
      }

      * { box-sizing: border-box; }
      html {
        min-width: 320px;
        background: var(--paper);
        font-size: 16px;
        scrollbar-gutter: stable;
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      body {
        margin: 0;
        color: var(--ink);
        background: var(--paper);
        font-family: var(--sans);
        font-size: 20px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      button, a { font: inherit; }
      button:focus-visible, a:focus-visible {
        outline: 2px solid var(--pink);
        outline-offset: 5px;
      }

      .page { width: min(var(--page-max-width), var(--page-width)); margin: 0 auto; }
      .masthead {
        min-height: 112px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 32px;
        border-bottom: 1px solid var(--line);
      }
      .wordmark {
        color: var(--ink);
        font-size: 32px;
        font-weight: 650;
        letter-spacing: -.035em;
        text-decoration: none;
      }
      .masthead-links {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 10px 24px;
      }
      .masthead-links a {
        color: var(--ink);
        font-size: 16px;
        text-decoration-color: var(--cyan);
        text-underline-offset: 5px;
        transition: color .2s ease, text-decoration-color .2s ease;
      }
      .masthead-links a:hover { color: var(--cyan); }

      .work { padding: 50px 0 88px; }
      .project-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        column-gap: 22px;
        row-gap: 72px;
      }
      .project-card {
        display: block;
        width: 100%;
        min-width: 0;
        padding: 0;
        border: 0;
        color: inherit;
        background: transparent;
        text-align: left;
        cursor: pointer;
      }
      .project-image {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        background: #1b1b1b;
      }
      .project-image img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform .55s cubic-bezier(.2,.7,.2,1), filter .35s ease;
      }
      .project-card:hover .project-image img,
      .project-card:focus-visible .project-image img {
        transform: scale(1.025);
        filter: saturate(1.06);
      }
      .project-caption {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 14px;
        width: 100%;
        padding-top: 14px;
      }
      .project-name {
        font-size: 20px;
        font-weight: 550;
        letter-spacing: -.015em;
      }
      .project-meta {
        color: var(--muted);
        font-size: 16px;
        letter-spacing: .01em;
        text-align: right;
        white-space: nowrap;
      }
      .project-card:hover .project-name { text-decoration: underline; text-decoration-color: var(--cyan); text-underline-offset: 4px; }
      .site-footer {
        display: flex;
        justify-content: flex-end;
        gap: 20px;
        padding: 22px 0 28px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 16px;
      }

      .viewer {
        position: fixed;
        inset: 0;
        width: 100%;
        max-width: none;
        height: 100%;
        max-height: none;
        margin: 0;
        padding: 20px 0 24px;
        overflow: hidden;
        border: 0;
        color: #f5f5f5;
        background: #101010;
      }
      .viewer[open] { display: flex; flex-direction: column; }
      .viewer::backdrop { background: #101010; }
      .viewer[open] { animation: viewer-enter .24s ease-out both; }
      .viewer-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: min(var(--page-max-width), var(--page-width));
        min-height: 62px;
        margin-inline: auto;
        padding-bottom: 16px;
        border-bottom: 1px solid #353535;
      }
      .viewer-title {
        margin: 0;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -.025em;
      }
      .viewer-close, .viewer-arrow {
        display: grid;
        place-items: center;
        padding: 0;
        border: 1px solid #414141;
        color: #fff;
        background: transparent;
        cursor: pointer;
        transition: border-color .2s ease, color .2s ease, background .2s ease;
      }
      .viewer-close:hover, .viewer-arrow:hover {
        border-color: var(--cyan);
        color: var(--cyan);
      }
      .viewer-close { width: 44px; height: 44px; border-radius: 50%; }
      .viewer-close svg { display: block; width: 20px; height: 20px; }
      .viewer-media {
        position: relative;
        display: flex;
        flex: 1;
        flex-direction: column;
        width: min(var(--page-max-width), var(--page-width));
        min-height: 0;
        margin: 18px auto 16px;
      }
      .viewer-stage {
        position: relative;
        display: grid;
        flex: 1;
        min-height: 0;
        place-items: center;
        width: 100%;
        touch-action: pan-y;
      }
      .viewer-image {
        display: block;
        width: min(1600px, calc(100vw - 220px));
        max-height: calc(100% - 80px);
        aspect-ratio: 16 / 9;
        object-fit: contain;
        background: #171717;
        user-select: none;
        -webkit-user-drag: none;
      }
      .viewer-controls {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template: "previous . next" 1fr ". pagination ." auto / 44px 1fr 44px;
        align-items: center;
        pointer-events: none;
      }
      .viewer-arrow {
        position: relative;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        font-size: 26px;
        pointer-events: auto;
      }
      .viewer-arrow:disabled { opacity: .25; cursor: default; }
      .viewer-arrow:disabled:hover { border-color: #414141; color: #fff; }
      .viewer-previous { grid-area: previous; justify-self: start; }
      .viewer-next { grid-area: next; justify-self: end; }
      .viewer-pagination {
        grid-area: pagination;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding-bottom: 10px;
      }
      .viewer-progress {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .viewer-progress-segment {
        display: block;
        width: 32px;
        height: 8px;
        border-radius: 999px;
        background: #4a4a4a;
        transition: width .2s ease, background-color .2s ease;
      }
      .viewer-progress-segment.is-active {
        width: 46px;
        background: var(--cyan);
      }
      .viewer-count {
        color: #c5c5c5;
        font-size: 20px;
        font-variant-numeric: tabular-nums;
      }
      .viewer-info {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: end;
        gap: 32px;
        width: min(var(--page-max-width), var(--page-width));
        margin: 0 auto;
        padding: 20px 0 0;
        border-top: 1px solid #353535;
        animation: details-enter .35s .06s ease-out both;
      }
      .viewer-copy { max-width: 920px; }
      .viewer-kicker {
        margin: 0 0 8px;
        color: #b8b8b8;
        font-size: 16px;
        font-weight: 550;
        letter-spacing: .14em;
        text-transform: uppercase;
      }
      .viewer-project {
        margin: 0 0 8px;
        color: #fff;
        font-size: 36px;
        font-weight: 600;
        letter-spacing: -.035em;
        line-height: 1.1;
      }
      .viewer-caption { margin: 0; color: #dedede; font-size: 20px; line-height: 1.4; }
      .viewer-caption-note { margin: 10px 0 0; color: #c0c0c0; font-size: 16px; }
      .viewer-actions { display: flex; align-items: flex-end; justify-content: flex-end; }
      .viewer-link {
        color: #fff;
        font-size: 20px;
        font-weight: 550;
        text-decoration-color: var(--cyan);
        text-underline-offset: 5px;
        transition: color .2s ease, text-underline-offset .2s ease;
      }
      .viewer-link:hover { color: var(--cyan); text-underline-offset: 8px; }
      .viewer-link[hidden] { display: none; }

      @media (min-width: 1500px) {
        .project-grid { column-gap: 28px; row-gap: 80px; }
      }
      @media (max-width: 900px) {
        :root { --page-width: calc(100% - 48px); }
        .project-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 42px 18px; }
      }
      @media (max-width: 560px) {
        :root { --page-width: calc(100% - 32px); }
        .masthead { min-height: 0; align-items: flex-start; flex-direction: column; gap: 24px; padding: 22px 0 24px; }
        .wordmark { font-size: 28px; }
        .masthead-links { width: 100%; justify-content: flex-start; column-gap: 20px; row-gap: 12px; }
        .work { padding-top: 34px; }
        .project-grid { grid-template-columns: 1fr; row-gap: 54px; }
        .project-caption { padding-top: 12px; }
        .project-name { font-size: 20px; }
        .project-meta { max-width: 48%; white-space: normal; }
        .viewer { overflow-y: auto; padding: 12px 0 24px; }
        .viewer-header { width: var(--page-width); min-height: 62px; padding-bottom: 14px; }
        .viewer-title { font-size: 24px; }
        .viewer-media { flex: 0 0 auto; width: 100%; margin: 20px auto 0; }
        .viewer-stage { display: grid; grid-template-columns: 56px minmax(0, 1fr) 56px; grid-template-rows: auto auto; gap: 20px 0; width: 100%; }
        .viewer-image { grid-column: 1 / -1; grid-row: 1; width: 100vw; max-width: none; max-height: 56dvh; aspect-ratio: 16 / 9; object-fit: contain; }
        .viewer-controls {
          position: static;
          grid-column: 1 / -1;
          grid-row: 2;
          grid-template: "previous pagination next" auto / 56px minmax(0, 1fr) 56px;
          width: 100%;
          padding: 0 16px;
          pointer-events: auto;
        }
        .viewer-arrow { width: 56px; height: 56px; font-size: 28px; }
        .viewer-pagination { gap: 12px; padding: 0; }
        .viewer-progress { gap: 7px; }
        .viewer-progress-segment { width: 27px; height: 8px; }
        .viewer-progress-segment.is-active { width: 45px; }
        .viewer-count { font-size: 20px; }
        .viewer-info {
          grid-template-columns: minmax(0, 1fr);
          gap: 18px;
          width: var(--page-width);
          margin: 28px auto 0;
          padding: 24px 0 0;
        }
        .viewer-kicker { margin-bottom: 10px; }
        .viewer-project { font-size: 32px; }
        .viewer-caption { font-size: 20px; }
        .viewer-actions { justify-content: flex-start; }
        .site-footer { font-size: 16px; }
      }
      @keyframes viewer-enter { from { opacity: 0; } to { opacity: 1; } }
      @keyframes details-enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="masthead">
        <a class="wordmark" href="/">Jonathon Westbrook</a>
        <nav class="masthead-links" aria-label="Professional links">
          <a href="/resume/Jonathon_Westbrook_Resume_Design-Engineer-Final.pdf" target="_blank" rel="noopener noreferrer">Resume ↗</a>
          <a href="https://www.linkedin.com/in/jonathonwestbrook" target="_blank" rel="noopener noreferrer">LinkedIn ↗</a>
          <a href="https://github.com/Jon-Westbrook" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
        </nav>
      </header>

      <main class="work">
        <h1 class="visually-hidden">Portfolio of Jonathon Westbrook</h1>
        <section class="project-grid" aria-label="Selected projects">
          <button class="project-card" type="button" data-project="autobot" aria-haspopup="dialog" aria-label="View AUTOBOT project images">
            <span class="project-image"><img src="/assets/work/autobot-strategies.png" alt="AUTOBOT strategy leaderboard and development backtest performance" width="1439" height="809" fetchpriority="high"></span>

            <span class="project-image"><img src="/assets/work/persona-home.jpg" alt="AI Persona Builder interface and agent conversation" width="1920" height="1080"></span>
            <span class="project-caption"><span class="project-name">Persona Builder</span><span class="project-meta">AI · Synthetic personas</span></span>
          </button>
          <button class="project-card" type="button" data-project="futures" aria-haspopup="dialog" aria-label="View Futures Fundamentals project image">
            <span class="project-image"><img src="/assets/work/futures-fundamentals.jpg" alt="Illustrated cityscape introducing Futures Fundamentals" width="1920" height="1080"></span>
            <span class="project-caption"><span class="project-name">Futures Fundamentals</span><span class="project-meta">Education · Motion</span></span>
          </button>
          <button class="project-card" type="button" data-project="cardx" aria-haspopup="dialog" aria-label="View CardX project image">
            <span class="project-image"><img src="/assets/work/cardx.jpg" alt="CardX point-of-sale dashboard with sales and deposits data visualizations" width="1920" height="1080"></span>
            <span class="project-caption"><span class="project-name">CardX</span><span class="project-meta">Product · Design system</span></span>
          </button>
          <button class="project-card" type="button" data-project="icsc" aria-haspopup="dialog" aria-label="View ICSC project image">
            <span class="project-image"><img src="/assets/work/icsc.jpg" alt="ICSC website with New York skyline and event content" width="1920" height="1080"></span>
            <span class="project-caption"><span class="project-name">ICSC</span><span class="project-meta">Digital · Design system</span></span>
          </button>
          <button class="project-card" type="button" data-project="polling" aria-haspopup="dialog" aria-label="View VML Polling Kiosk design concept">
            <span class="project-image"><img src="/assets/work/vml-polling-concept.jpg" alt="VML Polling Kiosks dashboard concept with colorful poll results chart" width="1920" height="1080"></span>
            <span class="project-caption"><span class="project-name">VML Polling Kiosk</span><span class="project-meta">Interface concept</span></span>
          </button>
        </section>
      </main>

      <footer class="site-footer">
        <span>Technology, made human.</span>
      </footer>
    </div>

    <dialog class="viewer" aria-label="Project image viewer">
      <div class="viewer-header">
        <h2 class="viewer-title" id="viewer-title">Project</h2>
        <button class="viewer-close" type="button" aria-label="Close project viewer">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M6 6 18 18M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
          </svg>
        </button>
      </div>
      <div class="viewer-media">
        <div class="viewer-stage">
          <img class="viewer-image" src="" alt="">
          <div class="viewer-controls">
            <button class="viewer-arrow viewer-previous" type="button" aria-label="Previous image">‹</button>
            <div class="viewer-pagination">
              <div class="viewer-progress" role="progressbar" aria-label="Image progress" aria-valuemin="1" aria-valuemax="1" aria-valuenow="1"></div>
              <span class="viewer-count" aria-live="polite"></span>
            </div>
            <button class="viewer-arrow viewer-next" type="button" aria-label="Next image">›</button>
          </div>
        </div>
      </div>
      <div class="viewer-info">
        <div class="viewer-copy">
          <p class="viewer-kicker">Case Study</p>
          <h3 class="viewer-project"></h3>
          <p class="viewer-caption"><span class="viewer-description"></span></p>
          <p class="viewer-caption-note" hidden></p>
        </div>
        <div class="viewer-actions" hidden>
          <a class="viewer-link" href="" target="_blank" rel="noopener noreferrer" hidden></a>
        </div>
      </div>
    </dialog>

    <script>
      (() => {
        const projects = {
          autobot: {
            title: "AUTOBOT",
            description: "A human-reviewed research system for exploring AI-generated trading strategy experiments.",
            note: "Public demo uses synthetic data. Historical and modeled results are not a guarantee of future performance.",
            link: "https://autobot-demo.netlify.app/",
            linkText: "Open synthetic-data demo ↗",
            slides: [
              { src: "/assets/work/autobot-strategies.png", alt: "Strategies page showing Core Wealth performance metrics and development backtest." },
              { src: "/assets/work/autobot-trading.png", alt: "Trading page showing historical strategy performance and execution metrics." },
              { src: "/assets/work/autobot-health.png", alt: "System health panel showing trading and AutoResearch service status." }
            ]
          },
          persona: {
            title: "Persona Builder",
            description: "A research tool for turning audience data into structured personas and conversational insights.",
            slides: [
              { src: "/assets/work/persona-home.jpg", alt: "Product introduction and AI persona assistant." },
              { src: "/assets/work/persona-profile.jpg", alt: "Finalized audience persona with visual recommendation." },
              { src: "/assets/work/persona-library.jpg", alt: "Persona library organized into draft and final audiences." },
              { src: "/assets/work/persona-detail.jpg", alt: "Persona detail view with audience summary and selected signals." },
              { src: "/assets/work/persona-social-sharers.jpg", alt: "Persona detail concept for a high-volume social-sharing audience." }
            ]
          },
          futures: {
            title: "Futures Fundamentals",
            description: "An illustrated learning experience that makes futures and derivatives markets easier to explore.",
            link: "https://www.futuresfundamentals.org/",
            linkText: "Visit live site ↗",
            slides: [
              { src: "/assets/work/futures-fundamentals.jpg", alt: "Illustrated opening screen for Futures Fundamentals." }
            ]
          },
          cardx: {
            title: "CardX",
            description: "A responsive point-of-sale experience supported by reusable interface components and templates.",
            link: "/cardx/?p=Templates-T02-Home",
            linkText: "View live project ↗",
            slides: [
              { src: "/assets/work/cardx.jpg", alt: "CardX home dashboard with terminal, sales, and deposit reporting." }
            ]
          },
          icsc: {
            title: "ICSC",
            description: "A large content experience shaped by a modular design system.",
            link: "/icsc/?p=templates-T01-Home",
            linkText: "View live project ↗",
            slides: [
              { src: "/assets/work/icsc.jpg", alt: "ICSC site with city imagery and event content." }
            ]
          },
          polling: {
            title: "VML Polling Kiosk",
            description: "A colorful dashboard concept for managing audience polls and presenting results.",
            note: "Interface design concept; not a live product.",
            slides: [
              { src: "/assets/work/vml-polling-concept.jpg", alt: "Polling dashboard concept with answer controls and a live-results visualization." }
            ]
          }
        };

        const dialog = document.querySelector(".viewer");
        const image = dialog.querySelector(".viewer-image");
        const title = dialog.querySelector(".viewer-title");
        const projectLabel = dialog.querySelector(".viewer-project");
        const description = dialog.querySelector(".viewer-description");
        const note = dialog.querySelector(".viewer-caption-note");
        const count = dialog.querySelector(".viewer-count");
        const progress = dialog.querySelector(".viewer-progress");
        const link = dialog.querySelector(".viewer-link");
        const actions = dialog.querySelector(".viewer-actions");
        const previous = dialog.querySelector(".viewer-previous");
        const next = dialog.querySelector(".viewer-next");
        const close = dialog.querySelector(".viewer-close");
        let activeProject;
        let activeIndex = 0;
        let returnFocus;
        let touchStartX = null;

        function showSlide() {
          const project = projects[activeProject];
          const slide = project.slides[activeIndex];
          image.src = slide.src;
          image.alt = slide.alt;
          title.textContent = project.title;
          projectLabel.textContent = project.title;
          description.textContent = project.description;
          note.textContent = project.note || "";
          note.hidden = !project.note;
          count.textContent = `${String(activeIndex + 1).padStart(2, "0")} / ${String(project.slides.length).padStart(2, "0")}`;
          progress.setAttribute("aria-valuemax", String(project.slides.length));
          progress.setAttribute("aria-valuenow", String(activeIndex + 1));
          progress.setAttribute("aria-valuetext", `Image ${activeIndex + 1} of ${project.slides.length}`);
          progress.replaceChildren(...project.slides.map((_, index) => {
            const segment = document.createElement("span");
            segment.className = `viewer-progress-segment${index === activeIndex ? " is-active" : ""}`;
            segment.setAttribute("aria-hidden", "true");
            return segment;
          }));
          previous.disabled = project.slides.length < 2;
          next.disabled = project.slides.length < 2;
          link.hidden = !project.link;
          actions.hidden = !project.link;
          if (project.link) {
            link.href = project.link;
            link.textContent = project.linkText;
          }
        }

        function openProject(id, trigger) {
          activeProject = id;
          activeIndex = 0;
          returnFocus = trigger;
          showSlide();
          dialog.showModal();
          close.focus();
        }

        function step(direction) {
          const slides = projects[activeProject].slides;
          activeIndex = (activeIndex + direction + slides.length) % slides.length;
          showSlide();
        }

        document.querySelectorAll(".project-card").forEach((card) => {
          card.addEventListener("click", () => openProject(card.dataset.project, card));
        });
        close.addEventListener("click", () => dialog.close());
        previous.addEventListener("click", () => step(-1));
        next.addEventListener("click", () => step(1));
        dialog.addEventListener("click", (event) => {
          if (!event.target.closest(".viewer-image, .viewer-arrow, .viewer-close, a")) dialog.close();
        });
        dialog.addEventListener("close", () => {
          if (returnFocus) returnFocus.focus();
        });
        dialog.addEventListener("keydown", (event) => {
          if (event.key === "Tab") {
            const focusable = [...dialog.querySelectorAll("button:not(:disabled), a[href]:not([hidden])")];
            const first = focusable[0];
            const last = focusable[focusable.length - 1];
            if (event.shiftKey && (document.activeElement === first || !dialog.contains(document.activeElement))) {
              event.preventDefault();
              last.focus();
            } else if (!event.shiftKey && (document.activeElement === last || !dialog.contains(document.activeElement))) {
              event.preventDefault();
              first.focus();
            }
          } else if (event.key === "ArrowLeft") {
            event.preventDefault();
            step(-1);
          } else if (event.key === "ArrowRight") {
            event.preventDefault();
            step(1);
          }
        });
        image.addEventListener("pointerdown", (event) => { touchStartX = event.clientX; });
        image.addEventListener("pointerup", (event) => {
          if (touchStartX === null) return;
          const delta = event.clientX - touchStartX;
          touchStartX = null;
          if (Math.abs(delta) > 45) step(delta < 0 ? 1 : -1);
        });
        image.addEventListener("pointercancel", () => { touchStartX = null; });
      })();
    </script>
  </body>
</html>
